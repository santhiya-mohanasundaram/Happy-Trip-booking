# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# MySQL Database Configuration (Reads from .env or System Environment)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:travel_booking_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Security / JWT & Gateway Configuration
app.jwt.secret=${JWT_SECRET:TripEaseSecureJwtSecretKey2026TravelBookingSystem987654}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}
app.payment.gateway.mode=${PAYMENT_GATEWAY_MODE:MOCK}
app.payment.gateway.key=${PAYMENT_GATEWAY_KEY:pk_test_tripease_mock_key_2026}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Logging
logging.level.com.tripease.travelbooking=INFO
logging.level.org.springframework.web=INFO
